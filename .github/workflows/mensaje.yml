name: Enviar Mensaje Diario
on:
  schedule:
    # Esto se ejecuta todos los días a las 22:00 UTC (18:00 hora Chile)
    - cron: '0 22 * * *'
  workflow_dispatch: # Esto nos permite probarlo manualmente

jobs:
  enviar_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensaje a Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "¿Se juega hoy? 🐶"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
