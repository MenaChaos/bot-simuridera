name: Enviar Mensaje Diario
on:
  schedule:
    - cron: '0 22 * * *' # 18:00 hora Chile
  workflow_dispatch:

jobs:
  enviar_webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar script de mensajes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python mensajes.py
